# ==============================================================================
# EFIDP — Egypt Financial Intelligence Data Platform
# Docker Compose — Local Development Stack
#
# Port Mapping (conflict-free):
#   PostgreSQL  → host:5433  (avoid clash with local postgres on 5432)
#   MinIO API   → host:9000
#   MinIO UI    → host:9001
#   Kafka       → host:9092  (KRaft, external listener)
#   Redis       → host:6380  (avoid clash with any local redis on 6379)
#   Airflow     → host:8085  (avoid clash with any local server on 8080)
#   FastAPI     → host:8001  (avoid clash with any local server on 8000)
#   Prometheus  → host:9090
#   Grafana     → host:3001  (avoid clash with any local Grafana on 3000)
# ==============================================================================

services:
  # ============================================================
  # POSTGRESQL 16 — Analytical Warehouse + Airflow Metastore
  # Purpose: Hosts EFIDP star schema warehouse, data quality
  #   audit tables, lineage metadata, and Airflow scheduler DB.
  # ============================================================
  efidp-postgres:
    image: postgres:16-alpine
    container_name: efidp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-efidp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-efidp_dev_secret_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-efidp_dw}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - efidp_pg_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - efidp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-efidp_admin} -d ${POSTGRES_DB:-efidp_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================
  # MINIO — S3-Compatible Lakehouse Object Store
  # Purpose: Hosts Bronze / Silver / Gold / Quarantine buckets.
  #   Acts as the persistent file store for Parquet datasets,
  #   raw ingestion payloads, and processed analytical files.
  # ============================================================
  efidp-minio:
    image: quay.io/minio/minio:latest
    container_name: efidp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret_dev}
    volumes:
      - efidp_minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - efidp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # MINIO MC INIT — Bucket Provisioner (ephemeral)
  # Purpose: Creates required EFIDP Lakehouse buckets on startup.
  #   Runs once then exits. MinIO client (mc) connects via API.
  # ============================================================
  efidp-minio-init:
    image: quay.io/minio/mc:latest
    container_name: efidp-minio-init
    depends_on:
      efidp-minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT_URL: http://efidp-minio:9000
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret_dev}
    volumes:
      - ./infrastructure/docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - efidp-net
    restart: "no"

  # ============================================================
  # APACHE KAFKA (KRaft Mode) — Event Streaming Broker
  # Purpose: Receives high-frequency synthetic financial
  #   transaction events from producers. Provides durable,
  #   ordered, partitioned event log for stream consumers.
  #   KRaft eliminates Zookeeper dependency entirely.
  # ============================================================
  efidp-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: efidp-kafka
    restart: unless-stopped
    environment:
      # KRaft Mode: no Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@efidp-kafka:9093
      # Listeners:
      #   PLAINTEXT     → internal Docker network (efidp-net) on port 29092
      #   EXTERNAL      → host access via localhost:9092
      #   CONTROLLER    → KRaft internal controller on port 9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://efidp-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - efidp_kafka_data:/var/lib/kafka/data
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    networks:
      - efidp-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ============================================================
  # KAFKA TOPIC INIT — Topic Provisioner (ephemeral)
  # Purpose: Creates core EFIDP topics after Kafka is healthy.
  #   Runs once then exits.
  # ============================================================
  efidp-kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: efidp-kafka-init
    depends_on:
      efidp-kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: efidp-kafka:29092
    volumes:
      - ./infrastructure/docker/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/sh", "/init-topics.sh"]
    networks:
      - efidp-net
    restart: "no"

  # ============================================================
  # REDIS 7 — Cache and Near-Real-Time Counters
  # Purpose: Provides fast key-value caching for API responses,
  #   near-real-time transaction velocity counters updated by
  #   stream consumers, and Airflow Celery backend (future).
  # ============================================================
  efidp-redis:
    image: redis:7-alpine
    container_name: efidp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - efidp_redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - efidp-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================
  # APACHE AIRFLOW — Orchestration Scheduler & Webserver
  # Purpose: Executes EFIDP batch pipelines: ingestion → Bronze
  #   → Silver quality gate → Gold transforms → warehouse load.
  #   Uses PostgreSQL as its metastore backend.
  # ============================================================
  efidp-airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: efidp-airflow-webserver
    restart: unless-stopped
    depends_on:
      efidp-postgres:
        condition: service_healthy
      efidp-airflow-init:
        condition: service_completed_successfully
    command: webserver
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_dev_password@efidp-postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoKcCNbryFtUmZoquC_nxIZsnRMHGpHtAmmUxbg=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev_airflow_secret_key_32_characters_min!}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin_password_dev}
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
      - efidp_airflow_logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_HOST_PORT:-8085}:8080"
    networks:
      - efidp-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  efidp-airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: efidp-airflow-scheduler
    restart: unless-stopped
    depends_on:
      efidp-postgres:
        condition: service_healthy
      efidp-airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_dev_password@efidp-postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoKcCNbryFtUmZoquC_nxIZsnRMHGpHtAmmUxbg=}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev_airflow_secret_key_32_characters_min!}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./pipelines/airflow/dags:/opt/airflow/dags
      - efidp_airflow_logs:/opt/airflow/logs
    networks:
      - efidp-net

  # ============================================================
  # AIRFLOW DB INIT — Metadata Schema Bootstrapper (ephemeral)
  # Purpose: Initializes Airflow PostgreSQL schema on first run.
  # ============================================================
  efidp-airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: efidp-airflow-init
    depends_on:
      efidp-postgres:
        condition: service_healthy
    command: db migrate
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_dev_password@efidp-postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoKcCNbryFtUmZoquC_nxIZsnRMHGpHtAmmUxbg=}
    networks:
      - efidp-net
    restart: "no"

  # ============================================================
  # FASTAPI — EFIDP Analytical Serving Layer
  # Purpose: Provides REST API access to warehouse data, quality
  #   reports, pipeline status, and anomaly alerts.
  #   Phase 2: only /api/v1/health and /metrics are live.
  # ============================================================
  efidp-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: efidp-api
    restart: unless-stopped
    depends_on:
      efidp-postgres:
        condition: service_healthy
      efidp-redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      POSTGRES_USER: ${POSTGRES_USER:-efidp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-efidp_dev_secret_change_in_prod}
      POSTGRES_HOST: efidp-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-efidp_dw}
      MINIO_ENDPOINT_URL: http://efidp-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_secret_dev}
      KAFKA_BOOTSTRAP_SERVERS: efidp-kafka:29092
      REDIS_HOST: efidp-redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    volumes:
      - ./apps:/app/apps:ro
      - ./src/efidp:/app/src/efidp:ro
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    networks:
      - efidp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================
  # PROMETHEUS — Metrics Collection
  # Purpose: Scrapes application metrics from FastAPI /metrics
  #   and infrastructure health indicators. Feeds Grafana.
  # ============================================================
  efidp-prometheus:
    image: prom/prometheus:v2.48.0
    container_name: efidp-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - efidp_prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - efidp-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # GRAFANA — Observability Dashboards
  # Purpose: Visualizes Prometheus metrics via provisioned
  #   dashboards: Platform Operations, Data Quality, Finance.
  # ============================================================
  efidp-grafana:
    image: grafana/grafana:10.2.0
    container_name: efidp-grafana
    restart: unless-stopped
    depends_on:
      efidp-prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:${GRAFANA_HOST_PORT:-3001}"
    volumes:
      - efidp_grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    networks:
      - efidp-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

# ==============================================================================
# NAMED VOLUMES — Persistent storage across container restarts
# ==============================================================================
volumes:
  efidp_pg_data:
    driver: local
    labels:
      service: postgres
      purpose: "EFIDP warehouse + Airflow metastore"
  efidp_minio_data:
    driver: local
    labels:
      service: minio
      purpose: "Lakehouse object storage (Bronze/Silver/Gold/Quarantine)"
  efidp_kafka_data:
    driver: local
    labels:
      service: kafka
      purpose: "Kafka event log and topic data"
  efidp_redis_data:
    driver: local
    labels:
      service: redis
      purpose: "Redis persistence (appendonly AOF)"
  efidp_airflow_logs:
    driver: local
    labels:
      service: airflow
      purpose: "Airflow task and scheduler logs"
  efidp_prom_data:
    driver: local
    labels:
      service: prometheus
      purpose: "Prometheus TSDB time series data"
  efidp_grafana_data:
    driver: local
    labels:
      service: grafana
      purpose: "Grafana dashboards and user state"

# ==============================================================================
# NETWORKS — Dedicated isolated Docker network for EFIDP
# ==============================================================================
networks:
  efidp-net:
    driver: bridge
    name: efidp-net
    labels:
      project: efidp
      environment: development
